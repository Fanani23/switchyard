# switchyard.nexorahq.my.id
#
# One entry per concern, matching the house style already used by the other sites on
# this host. Everything upstream listens on 127.0.0.1 only.

upstream switchyard_api {
  server 127.0.0.1:4100;
  keepalive 16;
}

upstream switchyard_web {
  server 127.0.0.1:3100;
  keepalive 16;
}

limit_req_zone $binary_remote_addr zone=switchyard_api_rl:10m rate=30r/s;

server {
  listen 80;
  listen [::]:80;
  server_name switchyard.nexorahq.my.id;
  return 301 https://$host$request_uri;
}

server {
  # `http2 on;` needs nginx >= 1.25.1; this host runs 1.24, which takes it on listen.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name switchyard.nexorahq.my.id;

  ssl_certificate /etc/letsencrypt/live/switchyard.nexorahq.my.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/switchyard.nexorahq.my.id/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # The dashboard holds an API key in sessionStorage; keep the page out of caches
  # and out of frames.
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 1m;

  # Server-sent events. Buffering here would hold each push until the buffer filled,
  # which is exactly the latency this project exists to avoid, and the default read
  # timeout would drop an idle stream between 30-second pings.
  location /api/v1/stream {
    proxy_pass http://switchyard_api/v1/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    limit_req zone=switchyard_api_rl burst=60 nodelay;
    proxy_pass http://switchyard_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://switchyard_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
